name: StudyBuddy CI and Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.6'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      # Current stable Next bundles a PostCSS release with an upstream high advisory.
      # Critical findings still fail releases; the exception is tracked in production-readiness.md.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: backend/go.sum

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  deploy-staging:
    name: Deploy to staging
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render deployment
        run: curl --fail --show-error --silent -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"

      - name: Wait for deployment readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --show-error --silent --output /dev/null https://api-staging.satym.in/api/health/ready; then
              echo "Staging readiness check passed on attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying in 10 seconds"
            sleep 10
          done
          echo "Staging readiness check failed"
          exit 1

  deploy-production:
    name: Deploy to production
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deployment
        run: curl --fail --show-error --silent -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"

      - name: Wait for deployment readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --show-error --silent --output /dev/null https://api.satym.in/api/health/ready; then
              echo "Production readiness check passed on attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying in 15 seconds"
            sleep 15
          done
          echo "Production readiness check failed"
          exit 1
